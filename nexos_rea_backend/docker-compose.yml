services:
  db:
    image: postgres:16-alpine
    container_name: nexos_rea_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexos_rea
    ports:
      - "5432:5432"
    volumes:
      - nexos_rea_data:/var/lib/postgresql/data

volumes:
  nexos_rea_data:
