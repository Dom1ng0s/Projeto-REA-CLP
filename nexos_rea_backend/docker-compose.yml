services:
  db:
    image: postgres:16-alpine
    container_name: nexos_rea_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexos_rea
    ports:
      - "5432:5432"
    volumes:
      - nexos_rea_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: nexos_rea_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobrescreve DATABASE_URL para apontar ao Supabase (definido no .env).
      # Para testes locais trocando para o serviço db acima:
      #   DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/nexos_rea
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  nexos_rea_data:
